<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5. 3D Blackboard & Teachi-Cast - Dhruv Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for Lightweight 3D Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col font-sans">

    <!-- Top Navigation / Header -->
    <header class="bg-slate-900 border-b border-teal-500/30 px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <a href="/" class="text-teal-400 hover:text-teal-300 text-sm font-bold flex items-center gap-1">⬅️ मुख्य डैशबोर्ड</a>
            <span class="text-gray-600">|</span>
            <h1 class="text-lg font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-cyan-400">5. 3D Blackboard & Teachi-Cast Hub</h1>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-xs bg-teal-950 text-teal-300 px-3 py-1 rounded-full border border-teal-800/50">⚡ Low-Bandwidth Optimized</span>
            <span id="walletTokens" class="text-xs bg-slate-800 text-cyan-300 px-3 py-1 rounded-full border border-slate-700">🪙 टोकन: 49,850</span>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Left Sidebar: Smart Tools & AI Avatar Controls -->
        <div class="lg:col-span-1 bg-slate-900/90 border border-teal-500/20 rounded-2xl p-5 flex flex-col space-y-5 shadow-xl">
            <h2 class="text-sm font-bold text-teal-400 uppercase tracking-wider">🛠️ 3D & Blackboard Controls</h2>
            
            <!-- Mode Switcher -->
            <div class="space-y-2">
                <label class="text-xs text-gray-400">मोड बदलें (Instant Switch)</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="switchMode('2d')" id="btn2d" class="py-2 bg-teal-600 text-white text-xs font-bold rounded-xl shadow transition">2D नॉर्मल बोर्ड</button>
                    <button onclick="switchMode('3d')" id="btn3d" class="py-2 bg-slate-800 hover:bg-slate-700 text-gray-300 text-xs font-bold rounded-xl transition">✨ 3D स्पेसियल</button>
                </div>
            </div>

            <!-- 3D Model Selector -->
            <div class="space-y-2">
                <label class="text-xs text-gray-400">3D ऑब्जेक्ट चुनें (पार्सिंग)</label>
                <select id="modelSelector" onchange="change3DModel(this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-teal-300 focus:outline-none focus:border-teal-500">
                    <option value="cube">घन (3D Cube / Matrix)</option>
                    <option value="sphere">गोला / पृथ्वी (Globe)</option>
                    <option value="pyramid">पिरमिड / त्रिकोण (Pyramid)</option>
                    <option value="dna">डीएनए स्ट्रक्चर (DNA Helix)</option>
                </select>
            </div>

            <!-- AI Avatar Assistant Controls -->
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-cyan-400">🤖 AI वर्चुअल अवतार</span>
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                </div>
                <p class="text-[11px] text-gray-400">टीचर के साथ बोर्ड पर घूमकर 3D नियम समझाने वाला सहायक।</p>
                <button onclick="toggleAvatar()" id="avatarBtn" class="w-full py-1.5 bg-cyan-950 hover:bg-cyan-900 text-cyan-300 text-xs rounded-lg border border-cyan-800/50 transition">अवतार ऑन/ऑफ़ करें</button>
            </div>

            <!-- Teachi-Cast Live Sync -->
            <div class="pt-2 border-t border-slate-800">
                <button onclick="startTeachiCast()" class="w-full py-2.5 bg-gradient-to-r from-teal-600 to-cyan-600 hover:from-teal-500 hover:to-cyan-500 text-white text-xs font-bold rounded-xl shadow-lg transition">📡 Teachi-Cast लाइव शुरू करें</button>
            </div>
        </div>

        <!-- Center / Right: Interactive Canvas Area -->
        <div class="lg:col-span-3 bg-slate-900/50 border border-slate-800 rounded-2xl p-4 flex flex-col relative overflow-hidden shadow-2xl">
            
            <!-- Canvas Header Bar -->
            <div class="flex justify-between items-center mb-3 bg-slate-900 px-4 py-2 rounded-xl border border-slate-800">
                <div class="flex items-center space-x-2">
                    <span id="currentModeIndicator" class="text-xs font-bold text-teal-400">मोड: 2D ब्लैकबोर्ड (लेखन सक्रिय)</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="clearCanvas()" class="px-3 py-1 bg-red-950/60 hover:bg-red-900 text-red-300 text-xs rounded-lg border border-red-800/50">पूरी स्क्रीन साफ़ करें</button>
                </div>
            </div>

            <!-- Dynamic Display Box (2D Writing Board or 3D WebGL Canvas) -->
            <div id="displayContainer" class="flex-1 bg-slate-950 rounded-xl border border-slate-800 relative overflow-hidden flex items-center justify-center min-h-[450px]">
                
                <!-- 2D Drawing / Writing Board Layer -->
                <canvas id="boardCanvas" class="absolute inset-w-full inset-h-full cursor-crosshair z-10 w-full h-full"></canvas>

                <!-- 3D WebGL Three.js Layer (Hidden by default) -->
                <div id="threeContainer" class="absolute inset-0 z-20 hidden w-full h-full"></div>

                <!-- AI Avatar Floating Box (Simulated Animation) -->
                <div id="aiAvatarBox" class="absolute bottom-4 right-4 bg-slate-900/90 border border-cyan-500/50 p-3 rounded-2xl shadow-2xl z-30 flex items-center space-x-3 backdrop-blur-md hidden transition-all duration-500">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-600 to-teal-400 flex items-center justify-center text-lg font-bold shadow">👨‍🏫</div>
                    <div>
                        <div class="text-xs font-bold text-cyan-300">AI गुरु अवतार</div>
                        <div id="avatarSpeech" class="text-[10px] text-gray-300">"बच्चों, अब इसे 3D में घुमाकर देखें!"</div>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Script Logic for Interactivity & 3D Rendering -->
    <script>
        let currentMode = '2d';
        let scene, camera, renderer, currentMesh;
        let isAvatarActive = false;

        // 2D Canvas Writing Logic
        const canvas = document.getElementById('boardCanvas');
        const ctx = canvas.getContext('2d');
        let painting = false;

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            ctx.strokeStyle = '#2dd4bf';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mousemove', draw);

        function startDraw(e) { if(currentMode === '2d') { painting = true; draw(e); } }
        function endDraw() { painting = false; ctx.beginPath(); }
        function draw(e) {
            if(!painting || currentMode !== '2d') return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Mode Switcher (2D <-> 3D)
        function switchMode(mode) {
            currentMode = mode;
            const btn2d = document.getElementById('btn2d');
            const btn3d = document.getElementById('btn3d');
            const threeDiv = document.getElementById('threeContainer');
            const indicator = document.getElementById('currentModeIndicator');

            if(mode === '3d') {
                btn3d.className = "py-2 bg-teal-600 text-white text-xs font-bold rounded-xl shadow transition";
                btn2d.className = "py-2 bg-slate-800 hover:bg-slate-700 text-gray-300 text-xs font-bold rounded-xl transition";
                canvas.style.display = 'none';
                threeDiv.classList.remove('hidden');
                indicator.innerText = "मोड: 3D स्पेसियल कैनवास (360° रोटेशन सक्रिय)";
                init3D();
            } else {
                btn2d.className = "py-2 bg-teal-600 text-white text-xs font-bold rounded-xl shadow transition";
                btn3d.className = "py-2 bg-slate-800 hover:bg-slate-700 text-gray-300 text-xs font-bold rounded-xl transition";
                threeDiv.classList.add('hidden');
                canvas.style.display = 'block';
                indicator.innerText = "मोड: 2D ब्लैकबोर्ड (लेखन सक्रिय)";
            }
        }

        // Three.js 3D Initialization
        function init3D() {
            const container = document.getElementById('threeContainer');
            if(scene) { container.innerHTML = ''; }

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0x2dd4bf, 1);
            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);

            create3DShape('cube');
            camera.position.z = 5;
            animate3D();
        }

        function create3DShape(type) {
            if(!scene) return;
            if(currentMesh) scene.remove(currentMesh);

            let geometry;
            if(type === 'cube') geometry = new THREE.BoxGeometry(2, 2, 2);
            else if(type === 'sphere') geometry = new THREE.SphereGeometry(1.5, 32, 32);
            else if(type === 'pyramid') geometry = new THREE.ConeGeometry(1.5, 2.5, 4);
            else geometry = new THREE.CylinderGeometry(1, 1, 3, 16);

            const material = new THREE.MeshStandardMaterial({ color: 0x0d9488, roughness: 0.3, metalness: 0.8, wireframe: false });
            currentMesh = new THREE.Mesh(geometry, material);
            scene.add(currentMesh);
        }

        function change3DModel(val) {
            if(currentMode === '3d') create3DShape(val);
        }

        function animate3D() {
            if(currentMode !== '3d') return;
            requestAnimationFrame(animate3D);
            if(currentMesh) {
                currentMesh.rotation.x += 0.01;
                currentMesh.rotation.y += 0.015;
            }
            renderer.render(scene, camera);
        }

        // AI Avatar Toggle
        function toggleAvatar() {
            isAvatarActive = !isAvatarActive;
            const avatarBox = document.getElementById('aiAvatarBox');
            if(isAvatarActive) {
                avatarBox.classList.remove('hidden');
            } else {
                avatarBox.classList.add('hidden');
            }
        }

        function startTeachiCast() {
            alert("📡 Teachi-Cast लाइव ब्रॉडकास्ट शुरू हो गया है! आपके सभी जुड़े छात्र अब इस 3D ब्लैकबोर्ड को लाइव देख रहे हैं।");
        }
    </script>
</body>
</html>
