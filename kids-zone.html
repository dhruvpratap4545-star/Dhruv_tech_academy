<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Kids Zone - Dhruv Tech Academy</title>
    <!-- Tailwind CSS for modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center p-4">

    <!-- 1. HEADER SECTION -->
    <div class="w-full max-w-2xl flex justify-between items-center my-4 px-2">
        <a href="/" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg transition">← मुख्य पोर्टल</a>
        
        <!-- भाषा टॉगल: हिं | English -->
        <div class="bg-slate-900 border border-slate-700 p-1 rounded-xl flex items-center shadow-inner gap-1">
            <button onclick="setLanguage('hi')" id="hiBtn" class="bg-cyan-600 text-white px-3 py-1 rounded-lg text-xs font-bold">हिं</button>
            <button onclick="setLanguage('en')" id="enBtn" class="text-slate-400 px-3 py-1 rounded-lg text-xs font-bold">English</button>
        </div>
    </div>

    <!-- 2. MAIN CONTENT AREA -->
    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl flex flex-col items-center">
        
        <!-- टीचर और स्कोर -->
        <div class="w-full flex justify-between items-center mb-6">
            <div class="flex items-center gap-3">
                <div class="w-14 h-14 bg-gradient-to-tr from-yellow-400 to-emerald-400 rounded-full flex items-center justify-center text-2xl animate-bounce">👩‍🏫</div>
                <div>
                    <span id="teacherName" class="text-sm text-emerald-400 font-bold block">नेबुला एआई टीचर</span>
                    <span class="text-[10px] text-slate-400">NC-Class 5 Learning</span>
                </div>
            </div>
            <div class="bg-slate-950 border border-cyan-500/50 px-4 py-2 rounded-xl text-center">
                <span id="scoreLabel" class="text-[10px] text-cyan-400 block font-bold uppercase">जीनियस स्कोर</span>
                <span id="scoreDisplay" class="text-lg font-extrabold text-yellow-300">⭐ 0</span>
            </div>
        </div>

        <!-- एआई डिस्प्ले बॉक्स -->
        <div id="aiText" class="w-full bg-slate-950 border border-slate-700 rounded-2xl p-6 min-h-[140px] text-cyan-200 text-center flex items-center justify-center text-lg mb-6 shadow-inner font-medium">
            नमस्ते मेरे नन्हे जीनियस! आज का चैलेंज शुरू करने के लिए विषय चुनें! 😊
        </div>

        <!-- चैलेंज बटन्स -->
        <div class="w-full grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">
            <button onclick="processQuestion('math')" class="bg-slate-800 hover:bg-slate-700 text-cyan-300 py-3 px-4 rounded-xl text-left font-medium transition shadow">➕ <span id="btn1">गणित: जोड़-घटाना</span></button>
            <button onclick="processQuestion('hindi')" class="bg-slate-800 hover:bg-slate-700 text-emerald-300 py-3 px-4 rounded-xl text-left font-medium transition shadow">🔤 <span id="btn2">हिंदी/English</span></button>
            <button onclick="processQuestion('evs')" class="bg-slate-800 hover:bg-slate-700 text-yellow-300 py-3 px-4 rounded-xl text-left font-medium transition shadow">🌿 <span id="btn3">EVS/Science</span></button>
            <button onclick="processQuestion('puzzle')" class="bg-slate-800 hover:bg-slate-700 text-pink-300 py-3 px-4 rounded-xl text-left font-medium transition shadow">🤔 <span id="btn4">सुपर पहेली</span></button>
        </div>

        <!-- इनपुट और सबमिट -->
        <input type="text" id="userInput" placeholder="यहाँ अपना जवाब टाइप करें..." class="w-full bg-slate-950 border border-slate-700 text-white px-4 py-3 rounded-xl mb-3 focus:border-cyan-500 outline-none">
        <button id="submitBtn" onclick="handleCustomInput()" class="w-full bg-emerald-600 py-3 rounded-xl font-bold shadow-lg text-white">एआई टीचर से जाँच करवाएं 🚀</button>

        <!-- व्हाट्सएप -->
        <div class="w-full mt-6 p-4 bg-green-900/20 rounded-2xl border border-green-700 text-center">
            <h3 id="repTitle" class="text-green-400 font-bold mb-2">🔥 प्रोग्रेस रिपोर्ट शेयर करें!</h3>
            <button id="waBtn" onclick="shareToWhatsApp()" class="w-full bg-green-600 py-3 rounded-xl font-bold text-white">WhatsApp पर भेजें 📱</button>
        </div>
    </div>

    <!-- SCRIPT (लॉजिक और भाषा) -->
    <script>
        let studentScore = 0;
        let currentLang = 'hi';

        const dict = {
            hi: { title: "एआई वर्चुअल क्लासरूम", teacher: "नेबुला एआई टीचर", score: "जीनियस स्कोर", welcome: "नमस्ते! आज क्या सीखना है?", b1: "गणित चैलेंज", b2: "हिंदी चैलेंज", b3: "EVS/Science", b4: "पहेली चैलेंज", inputPh: "यहाँ उत्तर टाइप करें...", submit: "जाँच करवाएं 🚀", repTitle: "🔥 प्रोग्रेस रिपोर्ट!", waBtn: "WhatsApp पर भेजें 📱" },
            en: { title: "AI Virtual Classroom", teacher: "Nebula AI Teacher", score: "Genius Score", welcome: "Hello! What to learn today?", b1: "Math Challenge", b2: "Language Challenge", b3: "EVS/Science", b4: "Puzzle Challenge", inputPh: "Type answer here...", submit: "Check Answer 🚀", repTitle: "🔥 Progress Report!", waBtn: "Share on WhatsApp 📱" }
        };

        function setLanguage(lang) {
            currentLang = lang;
            let d = dict[lang];
            document.getElementById('mainTitle').innerText = d.title;
            document.getElementById('teacherName').innerText = d.teacher;
            document.getElementById('scoreLabel').innerText = d.score;
            document.getElementById('aiText').innerText = d.welcome;
            document.getElementById('btn1').innerText = d.b1;
            document.getElementById('btn2').innerText = d.b2;
            document.getElementById('btn3').innerText = d.b3;
            document.getElementById('btn4').innerText = d.b4;
            document.getElementById('userInput').placeholder = d.inputPh;
            document.getElementById('submitBtn').innerText = d.submit;
            document.getElementById('repTitle').innerText = d.repTitle;
            document.getElementById('waBtn').innerText = d.waBtn;
            document.getElementById('hiBtn').className = (lang === 'hi') ? "bg-cyan-600 text-white px-3 py-1 rounded-lg text-xs font-bold" : "text-slate-400 px-3 py-1 rounded-lg text-xs font-bold";
            document.getElementById('enBtn').className = (lang === 'en') ? "bg-cyan-600 text-white px-3 py-1 rounded-lg text-xs font-bold" : "text-slate-400 px-3 py-1 rounded-lg text-xs font-bold";
        }

        function speakText(text, lang) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let u = new SpeechSynthesisUtterance(text);
                u.lang = (lang === 'en') ? 'en-US' : 'hi-IN';
                window.speechSynthesis.speak(u);
            }
        }

        function processQuestion(type) {
            let ans = (currentLang === 'hi') ? "वाह! सही जवाब! +15 अंक!" : "Awesome! Correct! +15 points!";
            studentScore += 15;
            document.getElementById('scoreDisplay').innerText = `⭐ ${studentScore}`;
            document.getElementById('aiText').innerText = ans;
            speakText(ans, currentLang);
        }

        function handleCustomInput() {
            let val = document.getElementById('userInput').value.trim();
            if (val) { processQuestion('math'); document.getElementById('userInput').value = ""; }
        }

        function shareToWhatsApp() {
            let msg = `Dhruv Tech Academy Challenge: My Score is ${studentScore}! Can you beat me? https://dhruv-tech-academy.onrender.com/`;
            window.open("https://wa.me/?text=" + encodeURIComponent(msg), '_blank');
        }
    </script>
</body>
</html>
