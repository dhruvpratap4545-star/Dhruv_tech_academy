        .btn-secondary:hover { background: #334155; }
        pre, ul { background: #020617; border: 1px solid #1e293b; padding: 12px; border-radius: 6px; max-height: 250px; overflow-y: auto; color: #34d399; font-family: monospace; font-size: 12px; margin: 0; }
        iframe { width: 100%; height: 260px; background: #ffffff; border: none; border-radius: 6px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 12px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; flex-wrap: wrap; }
        .tab-btn { background: #1e293b; color: #94a3b8; padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer; width: auto; font-size: 11px; font-weight: bold; }
        .tab-btn.active { background: #059669; color: white; }
        .sub-tab { background: #0f172a; border: 1px solid #1e293b; color: #cbd5e1; padding: 6px 10px; }
        .sub-tab.active { background: #06b6d4; color: #000; font-weight: bold; }
        .hidden { display: none; }
        .error-text { color: #f43f5e; font-weight: bold; }
        .success-text { color: #10b981; font-weight: bold; }
        .lang-select-box { background: #020617; border: 1px solid #0284c7; color: #38bdf8; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; outline: none; cursor: pointer; }

        function switchLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('user_lang', lang);

            var selector = document.getElementById('langSelector');
            if (selector) selector.value = lang;

            var d = healingTranslations[lang] || healingTranslations.hi;

            document.getElementById('headerMainTitle').innerText = d.mainTitle;
            document.getElementById('headerSubTitle').innerText = d.subTitle;
            document.getElementById('homeBtn').innerText = d.home;
            document.getElementById('lblInputSettings').innerText = d.inputSettings;
            document.getElementById('lblTargetLang').innerText = d.targetLang;
            document.getElementById('lblPasteCode').innerText = d.pasteCode;
            document.getElementById('healInput').placeholder = d.codePlaceholder;
            document.getElementById('btnRunHealing').innerText = d.runHealing;
            document.getElementById('btnClear').innerText = d.clear;
            document.getElementById('btnSample').innerText = d.sample;
            document.getElementById('tabReport').innerText = d.tabReport;
            document.getElementById('tabCode').innerText = d.tabCode;
            document.getElementById('tabSplit').innerText = d.tabSplit;
            document.getElementById('tabPreview').innerText = d.tabPreview;
            document.getElementById('lblCleanCodeHeader').innerText = d.cleanCodeHeader;
            document.getElementById('btnCopyCode').innerText = d.copyBtn;
            document.getElementById('lblSplitFiles').innerText = d.splitFilesLabel;
            document.getElementById('lblLivePreviewHeader').innerText = d.livePreviewHeader;

            var rList = document.getElementById('errorReportList');
            if(rList.innerText.includes('तैयार है') || rList.innerText.includes('ready') || rList.innerText.includes('ਸੱਜ ਹੈ')) {
                rList.innerHTML = '<li>' + d.readyMsg + '</li>';
            }
        }

        function switchMainTab(tabName, btn) {
            var contents = document.getElementsByClassName('tab-content');
            for(var i = 0; i < contents.length; i++) {
                contents[i].className = 'tab-content hidden';
            }
            
            var buttons = document.getElementsByClassName('tab-btn');
            for(var j = 0; j < buttons.length; j++) {
                if(buttons[j].className.indexOf('sub-tab') === -1) {
                    buttons[j].className = 'tab-btn';
                }
            }

            document.getElementById('view-' + tabName).className = 'tab-content';
            btn.className = 'tab-btn active';
        }

        function loadSampleCode() {
            var sample = '<div style="padding: 20px; background: #0f172a; color: #fff; border-radius: 8px; border: 1px solid #1e293b; text-align: center;">\n  <h2 style="color: #10b981; margin-top:0;">⚡ ध्रुव एकेडमी लाइव प्रीव्यू</h2>\n  <p style="font-size: 12px; color: #94a3b8;">यह फंक्शन और पेज प्रीव्यू का टेस्ट कंपोनेंट है।</p>\n  <button onclick="alert(\'बटन पूरी तरह से काम कर रहा है!\')" style="background: #059669; color: #fff; padding: 10px 20px; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">यहाँ क्लिक करके टेस्ट करें</button>\n</div>';
            document.getElementById('healInput').value = sample;
        }

        function clearAllData() {
            var d = healingTranslations[currentLang] || healingTranslations.hi;
            document.getElementById('healInput').value = '';
            document.getElementById('errorReportList').innerHTML = '<li>' + d.readyMsg + '</li>';
            document.getElementById('healedCodeBox').innerText = d.cleanCodePlaceholder;
            document.getElementById('splitFileBox').innerText = d.splitPlaceholder;
            document.getElementById('livePreviewFrame').srcdoc = '';
        }

        function runHealingAndPreview() {
            var d = healingTranslations[currentLang] || healingTranslations.hi;
            var inputData = document.getElementById('healInput').value;
            if(!inputData) {
                alert(d.emptyAlert);
                return;
            }

            var reportList = document.getElementById('errorReportList');
            var codeBox = document.getElementById('healedCodeBox');
            
            reportList.innerHTML = "<li>" + d.scanningMsg + "</li>";

            setTimeout(function() {
                var reports = [];
                var healed = inputData;

                if(inputData.indexOf('<div') !== -1 && inputData.indexOf('</div>') === -1) {
                    reports.push("<span class='error-text'>[Syntax Fix]:</span> " + d.syntaxFixMsg);
                    healed += "\n</div>";
                } else {
                    reports.push("<span class='success-text'>[Syntax Valid]:</span> " + d.syntaxValidMsg);
                }

                reports.push("<span class='success-text'>[Live Sandbox]:</span> " + d.sandboxMsg);

                reportList.innerHTML = "";
                for(var i = 0; i < reports.length; i++) {
                    var li = document.createElement('li');
                    li.style.marginBottom = "6px";
                    li.innerHTML = "• " + reports[i];
                    reportList.appendChild(li);
                }

                codeBox.innerText = healed;

                globalSplitFiles.html = [
                    "<!DOCTYPE html>",
                    "<html>",
                    "<head><meta charset=\"UTF-8\"></head>",
                    "<body style=\"background:#020617; color:#fff; font-family:sans-serif; padding:15px;\">",
                    healed,
                    "</body>",
                    "</html>"
                ].join("\n");
                
                globalSplitFiles.css = [
                    "/* Extracted Styles */",
                    "body {",
                    "    background-color: #020617;",
                    "    color: #cbd5e1;",
                    "    font-family: sans-serif;",
                    "}"
                ].join("\n");
                
                globalSplitFiles.js = [
                    "// Extracted Client Script",
                    "document.addEventListener('DOMContentLoaded', function() {",
                    "    console.log('Sandbox active.');",
                    "});"
                ].join("\n");
                
                globalSplitFiles.py = [
                    "# Python Backend Template (Flask)",
                    "from flask import Flask",
                    "app = Flask(__name__)",
                    "",
                    "@app.route('/')",
                    "def index():",
                    "    return 'Active'",
                    "",
                    "if __name__ == '__main__':",
                    "    app.run(port=8000)"
                ].join("\n");

                document.getElementById('splitFileBox').innerText = globalSplitFiles.html;

                var iframe = document.getElementById('livePreviewFrame');
                iframe.srcdoc = globalSplitFiles.html;

            }, 300);
        }

        function switchSubFile(fileType, btn) {
            var subBtns = document.getElementsByClassName('sub-tab');
            for(var i = 0; i < subBtns.length; i++) {
                subBtns[i].className = 'sub-tab tab-btn';
            }
            btn.className = 'sub-tab tab-btn active';
            document.getElementById('splitFileBox').innerText = globalSplitFiles[fileType];
        }

        function copyHealedCode() {
            var d = healingTranslations[currentLang] || healingTranslations.hi;
            var text = document.getElementById('healedCodeBox').innerText;
            if(navigator.clipboard) {
                navigator.clipboard.writeText(text).then(function() {
                    alert(d.copiedAlert);
                });
            } else {
                alert("Please select and copy manually.");
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            var savedLang = localStorage.getItem('user_lang') || 'hi';
            switchLanguage(savedLang);
        });
    </script>
</body>
</html>
