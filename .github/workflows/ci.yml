name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        # The health command is passed through to Docker as written: YAML block scalars do
        # not process escapes, so a backslash-escaped quote here reaches mongosh literally
        # and fails as a syntax error. Single quotes inside, double quotes outside.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      TEST_MONGODB_URL: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
      # The gate covers what actually reaches a browser. Every current high-severity
      # finding is in build and test tooling (vite, vitest, eslint and the picomatch /
      # tinyglobby / fdir chain under them), none of which is in the shipped bundle.
      # There is no forward fix to take: picomatch's advisory range is `*`, so no
      # released version is unaffected, and `npm audit fix --force` would roll vite and
      # vitest back two major versions — older code carrying its own advisories, and a
      # toolchain this app (React 19, Tailwind v4) does not build on.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high
      # Tooling advisories stay visible without blocking the build. Review them when a
      # fixed version appears upstream, and before a release.
      - name: Audit build tooling (informational)
        run: npm audit --audit-level=high
        continue-on-error: true
